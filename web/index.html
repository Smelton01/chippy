<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chippy — CHIP-8 (WebAssembly)</title>
  <style>
    :root { --fg: #e0e0e0; --dim: #888; --accent: #50fa7b; --bg: #0b0b0b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    h1 { font-size: 18px; margin: 0; color: var(--accent); letter-spacing: 2px; }
    h1 small { color: var(--dim); letter-spacing: 0; }
    #screen {
      width: 640px; height: 320px; background: #000;
      image-rendering: pixelated; border: 1px solid #333;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 660px; }
    button, label.file, select {
      background: #1a1a1a; color: var(--fg); border: 1px solid #444;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit;
    }
    button:hover, label.file:hover { border-color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }
    input[type=file] { display: none; }
    input[type=range] { accent-color: var(--accent); }
    #status { color: var(--dim); min-height: 1.4em; }
    #debug {
      width: 640px; background: #111; border: 1px solid #333; border-radius: 6px;
      padding: 10px 12px; white-space: pre; color: var(--fg); display: none;
    }
    #debug.on { display: block; }
    .keys { color: var(--dim); font-size: 12px; text-align: center; max-width: 640px; }
    kbd { background:#222; border:1px solid #444; border-radius:3px; padding:0 4px; }
  </style>
</head>
<body>
  <h1>chippy <small>· CHIP-8 in WebAssembly</small></h1>

  <canvas id="screen" width="64" height="32"></canvas>

  <div class="row">
    <button id="pause">⏸ Pause</button>
    <button id="stepBtn" disabled>⏭ Step</button>
    <button id="reset">↺ Reset</button>
    <button id="dbg">🐞 Debug</button>
    <button id="ibm">IBM logo</button>
    <label class="file">📂 Load ROM<input id="file" type="file" accept=".ch8,application/octet-stream" /></label>
  </div>

  <div class="row">
    <label>speed <input id="speed" type="range" min="5" max="40" value="12" /></label>
    <span id="speedval" class="dim">12 cyc/frame</span>
  </div>

  <div id="status">loading…</div>
  <pre id="debug"></pre>

  <div class="keys">
    keypad: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> / <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd>
    / <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> / <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd><kbd>V</kbd>
  </div>

  <script src="chip8.js"></script>
</body>
</html>
